<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#251c20">
  <meta name="description" content="A.P. Manicura en Barrio Martín, Rosario. Descubrí la propuesta de Agos y coordiná tu próximo turno." id="meta-description">
  <meta property="og:type" content="website">
  <meta property="og:title" content="A.P. Manicura | Uñas y turnos en Rosario">
  <meta property="og:description" content="A.P. Manicura en Barrio Martín, Rosario. Descubrí la propuesta de Agos y coordiná tu próximo turno.">
  <link rel="icon" href="assets/ap.svg">
  <title>A.P. Manicura | Uñas y turnos en Rosario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="config.js?v=4" defer></script>
  <script src="app.js?v=4" defer></script>
</head>
<body id="top">
<a class="skip-link" href="#main" data-i18n="skip">Saltar al contenido</a>
<div id="demo-ribbon" class="demo-ribbon" hidden><span data-business-demo></span></div>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#top" id="brand-link"><span class="brand-icon" id="brand-icon" aria-hidden="true">AP</span><span class="brand-type"><strong data-business-name></strong><small data-business-tagline></small></span></a>
    <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
      <a href="#services" data-i18n="navServices"></a>
      <a href="#gallery" data-i18n="navGallery"></a>
      <a href="#visit" data-i18n="navVisit"></a>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="lang-toggle" type="button"></button>
      <div id="header-booking-action"></div>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav"><span></span><span></span></button>
    </div>
    <span id="established" hidden><span data-i18n="establishedLabel"></span><span data-business-year></span></span>
  </div>
</header>

<main id="main">
  <section class="hero" data-header-theme="light" aria-labelledby="hero-title">
    <div class="container hero-grid">
      <div class="hero-copy reveal">
        <p class="eyebrow" data-i18n="heroEyebrow"></p>
        <h1 id="hero-title"><span data-i18n="heroLine1"></span> <em data-i18n="heroLine2"></em></h1>
        <p class="hero-description" data-i18n="heroDescription"></p>
        <div class="hero-actions"><div id="hero-primary-action"></div><a class="text-link" href="#services" data-i18n="exploreServices"></a></div>
      </div>
      <div class="hero-art reveal" id="hero-art">
        <div class="hero-image" id="hero-image" role="img" aria-label=""></div>
        <div class="editorial-art" id="editorial-art">
          <div class="art-inner" aria-hidden="true">
            <span class="art-monogram">AP</span>
            <div class="lacquers"><span></span><span></span><span></span></div>
          </div>
          <fieldset class="finish-picker">
            <legend data-i18n="finishPicker"></legend>
            <div class="finish-options">
              <label><input type="radio" name="nail-finish" value="nude"><span data-i18n="finishChoiceNude"></span></label>
              <label><input type="radio" name="nail-finish" value="wine"><span data-i18n="finishChoiceWine"></span></label>
              <label><input type="radio" name="nail-finish" value="chrome"><span data-i18n="finishChoiceChrome"></span></label>
            </div>
          </fieldset>
        </div>
      </div>
    </div>
  </section>

  <section class="services section-pad" id="services" data-header-theme="dark" aria-labelledby="services-title">
    <div class="container section-grid">
      <div class="reveal">
        <p class="eyebrow" data-i18n="servicesEyebrow"></p>
        <h2 class="display-title" id="services-title"><span data-i18n="servicesTitleFirst"></span> <em data-i18n="servicesTitleEm"></em></h2>
        <p class="section-caption" data-i18n="servicesCaption"></p>
        <p class="sample-note" id="sample-price-note" data-i18n="samplePrices"></p>
        <nav class="service-guide" id="service-guide" aria-labelledby="service-guide-title">
          <h3 id="service-guide-title" data-i18n="guideTitle"></h3>
          <a href="#service-manicura" data-i18n="guideNatural"></a>
          <a href="#service-polygel" data-i18n="guideLength"></a>
          <a href="#service-nail-art" data-i18n="guideDesign"></a>
        </nav>
      </div>
      <div class="service-list" id="service-list"></div>
    </div>
  </section>

  <section class="lookbook section-pad" id="gallery" data-header-theme="light" aria-labelledby="gallery-title">
    <div class="container">
      <div class="section-heading reveal">
        <div>
          <p class="eyebrow" data-i18n="galleryEyebrow"></p>
          <h2 class="display-title" id="gallery-title"><span data-i18n="galleryTitleFirst"></span> <em data-i18n="galleryTitleEm"></em></h2>
        </div>
        <p class="section-caption" data-i18n="galleryNote"></p>
      </div>
      <div class="gallery-palette" id="gallery-palette" hidden></div>
      <div class="gallery-grid" id="gallery-grid"></div>
      <div id="gallery-inspiration" class="inspiration-grid reveal">
        <figure><span class="finish finish-nude" aria-hidden="true"></span><figcaption data-i18n="finishNude"></figcaption></figure>
        <figure><span class="finish finish-wine" aria-hidden="true"></span><figcaption data-i18n="finishWine"></figcaption></figure>
        <figure><span class="finish finish-chrome" aria-hidden="true"></span><figcaption data-i18n="finishChrome"></figcaption></figure>
      </div>
    </div>
  </section>

  <section class="studio section-pad" id="story" data-header-theme="light" aria-labelledby="intro-title">
    <div class="container section-grid">
      <div class="studio-photo" id="studio-photo" hidden><div class="manifesto-image" id="manifesto-image" role="img" aria-label=""></div></div>
      <div class="reveal">
        <p class="eyebrow" data-i18n="introEyebrow"></p>
        <h2 class="display-title" id="intro-title"><span data-i18n="introTitleFirst"></span> <em data-i18n="introTitleEm"></em></h2>
      </div>
      <p class="lead-copy reveal" data-i18n="introLead"></p>
    </div>
  </section>

  <section class="booking-section section-pad" id="booking" data-header-theme="light" aria-labelledby="booking-title">
    <div class="container booking-inner reveal">
      <p class="eyebrow" data-i18n="bookingEyebrow"></p>
      <h2 class="display-title" id="booking-title"><span data-i18n="bookingTitleFirst"></span> <em data-i18n="bookingTitleEm"></em></h2>
      <p class="section-caption" data-i18n="bookingDescription"></p>
      <div id="manifesto-primary-action"></div>
      <small data-booking-unconfigured data-i18n="bookingDemoNote"></small>
      <p class="booking-status" id="booking-status" role="status" tabindex="-1" hidden></p>
    </div>
  </section>

  <section class="faq section-pad" data-header-theme="light" aria-labelledby="faq-title">
    <div class="container section-grid">
      <h2 class="display-title" id="faq-title" data-i18n="faqTitle"></h2>
      <div class="faq-list">
        <details><summary data-i18n="faqPhotoQuestion"></summary><p data-i18n="faqPhotoAnswer"></p></details>
        <details><summary data-i18n="faqRemovalQuestion"></summary><p data-i18n="faqRemovalAnswer"></p></details>
        <details><summary data-i18n="faqPriceQuestion"></summary><p data-i18n="faqPriceAnswer"></p></details>
      </div>
    </div>
  </section>

  <section class="visit section-pad" id="visit" data-header-theme="light" aria-labelledby="visit-title">
    <div class="container section-grid">
      <div class="reveal">
        <p class="eyebrow" data-i18n="visitEyebrow"></p>
        <h2 class="display-title" id="visit-title"><span data-i18n="visitTitleFirst"></span> <em data-i18n="visitTitleEm"></em></h2>
        <div id="visit-primary-action"></div>
      </div>
      <div class="visit-card reveal" id="visit-card">
        <div id="location-block"><span class="mini-label" data-i18n="locationLabel"></span><strong id="business-address"></strong><small id="business-address-note"></small></div>
        <div id="hours-block"><span class="mini-label" data-i18n="hoursLabel"></span><div id="hours-list"></div><small id="hours-note"></small></div>
        <div id="contact-block" hidden><span class="mini-label" data-i18n="contactLabel"></span><div id="contact-links"></div></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer" data-header-theme="dark">
  <div class="container">
    <div class="footer-top">
      <a class="footer-brand" href="#top" data-business-name></a>
      <div class="footer-right"><a href="#services" data-i18n="navServices"></a><a href="#gallery" data-i18n="navGallery"></a><a href="#visit" data-i18n="navVisit"></a></div>
      <div id="footer-contact-block" hidden><p class="mini-label" data-i18n="footerContactLabel"></p><div id="footer-contact-links"></div></div>
    </div>
    <div class="footer-bottom"><span>© <span data-copyright-year></span> <span data-business-name></span></span><span id="footer-demo-label" data-business-demo hidden></span><a href="#top" data-i18n="backTop"></a></div>
  </div>
</footer>
<a class="whatsapp-float" id="whatsapp-float" target="_blank" rel="noopener noreferrer" hidden>
  <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
    <path d="M16 4a12 12 0 0 0-10.4 18L4 28l6.2-1.6A12 12 0 1 0 16 4Z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M12.3 10.1c-.2-.5-.5-.5-.8-.5h-.7c-.4 0-.7.2-1 .5a4 4 0 0 0-.7 4.2c1 2.8 3.6 5.6 6.9 7 2.3 1 4.2 1 5.4-.3.4-.5.8-1.6.6-1.9-.1-.3-.5-.4-.9-.6l-2.4-1.2c-.4-.2-.7-.2-.9.1l-1.1 1.2c-.2.2-.4.2-.8 0a9 9 0 0 1-4-3.5c-.2-.3-.1-.5.1-.7l.8-1c.2-.2.2-.6.1-.8z" fill="currentColor"/>
  </svg>
</a>
<!-- VYB-BOOKING-MODAL-START -->
  <div class="booking-modal" id="booking-modal" hidden role="dialog" aria-modal="true" aria-labelledby="booking-modal-title" aria-describedby="booking-modal-help" tabindex="-1">
    <section class="booking-modal-panel">
      <header class="booking-modal-header">
        <div><p class="eyebrow" data-i18n="bookingModalEyebrow"></p><h2 id="booking-modal-title" data-i18n="bookingModalTitle"></h2></div>
        <button type="button" class="booking-modal-close" id="booking-modal-close" aria-label="Close booking window">✕</button>
      </header>
      <p class="booking-modal-help" id="booking-modal-help" data-i18n="bookingModalHelp"></p>
      <iframe id="booking-frame" class="booking-frame" title="Setmore booking page" loading="lazy" allow="web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <a class="booking-fallback" id="booking-fallback" target="_blank" rel="noopener noreferrer" hidden><span data-i18n="bookingOpenExternal"></span><span aria-hidden="true"> ↗</span></a>
    </section>
  </div>
  <!-- VYB-BOOKING-MODAL-END -->
<div class="lightbox" id="image-lightbox" hidden role="dialog" aria-modal="true" aria-label="Gallery image"><button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close image">✕</button><img id="lightbox-image" alt="Selected gallery image"/><p id="lightbox-caption"></p></div>
</body>
</html>
